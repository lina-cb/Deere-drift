# Deere Drift – statisches Spiel, ausgeliefert von einer eigenen Caddy-Instanz.
services:
  deere-drift:
    image: caddy:latest
    container_name: deere-drift
    restart: unless-stopped
    command: caddy file-server --root /srv --listen :80
    volumes:
      - ./dist:/srv:ro
    ports:
      - "8020:80"
